<body>
  <header><h1>Reach out if you have questions!</h1></header>

    <a href="index.html">Home</a>

    <a href="about.html">About</a>

<main>
     <section>
      <h2>Send a Message</h2>
      <form action="" method="post">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" required>

        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>

        <label for="subject">Subject</label>
        <select id="subject" name="subject">
          <option value="order">Order question</option>
          <option value="product">Product question</option>
          <option value="returns">Returns</option>
          <option value="other">Other</option>
        </select>

        <label for="message">Message</label>
        <textarea id="message" name="message" rows="6" required></textarea>

        <button>Send Message</button>
      </form>
    </section>
    <section>
      <h2>Get in Touch</h2>
      <ul>
        <li><strong>Email:</strong> <a href="mailto:hello@thegamingstore.co.za">hello@thegamingstore.co.za</a></li>
        <li><strong>Phone:</strong> <a href="tel:+27210000000">+27 21 000 0000</a></li>
        <li><strong>Hours:</strong> Mon–Fri, 9:00–17:00 SAST</li>
        <li><strong>Location:</strong> Cape Town, South Africa</li>
      </ul>
    </section>
  </main>
